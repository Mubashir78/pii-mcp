[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pii-mcp"
version = "1.9.1"
description = "Redact PII from MCP tool results before they reach the LLM — one-line FastMCP middleware, Rust-accelerated"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "foro.sh" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "fastmcp",
  "mcp-server",
  "middleware",
  "pii",
  "pii-detection",
  "pii-redaction",
  "redaction",
  "anonymization",
  "data-masking",
  "privacy",
  "gdpr",
  "avg",
  "dlp",
  "llm",
  "ai-agents",
  "ai-safety",
  "iban",
  "bsn",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Filters",
]
dependencies = []

[project.optional-dependencies]
fastmcp = [
  # Middleware API: Middleware, on_call_tool / on_read_resource / on_get_prompt,
  # ToolResult with content + structured_content (FastMCP 3.0+; CI tests
  # the 3.0.0 floor and the latest release).
  "fastmcp>=3.0.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pii-mcp[fastmcp]",
]
# Optional: local maturin develop (CI ships prebuilt wheels).
native = [
  "maturin>=1.7",
]

[project.urls]
Homepage = "https://github.com/foro-sh/pii-mcp"
Source = "https://github.com/foro-sh/pii-mcp"
Documentation = "https://github.com/foro-sh/pii-mcp#readme"
Examples = "https://github.com/foro-sh/pii-mcp/tree/main/examples"
Changelog = "https://github.com/foro-sh/pii-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/foro-sh/pii-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_mcp"]

[tool.maturin]
manifest-path = "crates/pii-mcp-native/Cargo.toml"
module-name = "pii_mcp._native"
python-source = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
